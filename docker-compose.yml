version: '3.8'

services:
  back_end:
    build:
      context: ./back_end
      dockerfile: Dockerfile
    container_name: medical_backend
    ports:
      - "4000:4000"
    env_file:
      - ./back_end/.env
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - medical_network

  front_end:
    build:
      context: ./front_end
      dockerfile: Dockerfile
    container_name: medical_frontend
    ports:
      - "8386:3000"
    depends_on:
      - back_end
    restart: unless-stopped
    networks:
      - medical_network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: medical_admin
    ports:
      - "8683:3000"
    depends_on:
      - back_end
    restart: unless-stopped
    networks:
      - medical_network

  redis:
    image: redis:alpine
    container_name: medical_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - medical_network

networks:
  medical_network:
    driver: bridge